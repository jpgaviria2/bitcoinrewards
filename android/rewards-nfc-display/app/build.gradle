plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bitcoinrewards.nfcdisplay'
    compileSdk 34

    defaultConfig {
        applicationId "com.bitcoinrewards.nfcdisplay"
        minSdk 19
        targetSdk 34
        versionCode 15
        versionName "1.11.3"
    }

    signingConfigs {
        release {
            def keystorePath = project.findProperty('REWARDS_NFC_KEYSTORE') ?: System.getenv('REWARDS_NFC_KEYSTORE') ?: '../release-keystore.jks'
            def keystorePassword = project.findProperty('REWARDS_NFC_KEYSTORE_PASSWORD') ?: System.getenv('REWARDS_NFC_KEYSTORE_PASSWORD')
            def keyAliasValue = project.findProperty('REWARDS_NFC_KEY_ALIAS') ?: System.getenv('REWARDS_NFC_KEY_ALIAS') ?: 'rewards-nfc'
            def keyPasswordValue = project.findProperty('REWARDS_NFC_KEY_PASSWORD') ?: System.getenv('REWARDS_NFC_KEY_PASSWORD')
            storeFile file(keystorePath)
            storePassword keystorePassword
            keyAlias keyAliasValue
            keyPassword keyPasswordValue
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
